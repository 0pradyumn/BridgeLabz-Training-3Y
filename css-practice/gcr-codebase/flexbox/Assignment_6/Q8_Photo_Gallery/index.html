<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery-page">
    <header><p class="eyebrow">VISUAL JOURNAL</p><h1>Places worth pausing for</h1><p>A small collection of scenes from near and far.</p></header>
    <section class="gallery" aria-label="Photo gallery">
      <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=85" alt="Golden sunlight across a mountain landscape"></div><figcaption>Golden hour in the hills</figcaption></figure>
      <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=85" alt="Mountain lake surrounded by forest"></div><figcaption>Still water, quiet mind</figcaption></figure>
      <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1000&q=85" alt="Ocean waves meeting the shore"></div><figcaption>Where the sea begins</figcaption></figure>
      <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1000&q=85" alt="Sunrise over a misty green field"></div><figcaption>A fresh start</figcaption></figure>
      <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=85" alt="Sunlight in a green forest"></div><figcaption>Into the green</figcaption></figure>
      <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=85" alt="Snowy mountain peaks beneath the sky"></div><figcaption>Above the clouds</figcaption></figure>
    </section>
  </main>
</body>
</html>
